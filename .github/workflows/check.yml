name: Check scripts
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src scripts chapter-2 chapter-3 chapter-4 chapter-5
      - run: bash -n scripts/run_member.sh
